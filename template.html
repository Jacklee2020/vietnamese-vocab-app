<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="越南语千词斩">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4aa3df">
<title>越南语千词斩</title>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --text:#1c1c1e; --sub:#8e8e93;
  --pri:#4aa3df; --pri2:#83c4ef; --grad:linear-gradient(135deg,#4aa3df 0%,#83c4ef 100%);
  --ok:#2fb35b; --okbg:#e7f7ee; --bad:#ff3b30; --badbg:#ffe9e7;
  --gold:#ffcc00; --line:#e9eaee; --shadow:0 4px 18px rgba(0,0,0,.07); --tabh:58px;
}
.dark{
  --bg:#101318; --card:#1b1f26; --text:#f2f2f7; --sub:#8f929b;
  --line:#2a2f38; --shadow:0 4px 18px rgba(0,0,0,.35);
  --okbg:#1d3326; --badbg:#3a1f1e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Roboto,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
/* header */
.top{position:sticky;top:0;z-index:30;background:var(--grad);color:#fff;padding:16px 16px 14px;border-radius:0 0 24px 24px;box-shadow:0 4px 14px rgba(74,163,223,.25)}
.top h1{font-size:20px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.top .sub{font-size:12px;opacity:.85;margin-top:3px}
.topbar-row{display:flex;align-items:center;gap:10px}
.btn-back{background:rgba(255,255,255,.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;flex:none}
/* main */
main{flex:1;padding:14px 14px calc(var(--tabh) + 24px);overflow-y:auto}
/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}
.tabbar{max-width:520px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;background:none;border:none;color:var(--sub);font-size:10px;cursor:pointer}
.tab .ic{font-size:20px;line-height:1;filter:grayscale(1);opacity:.55}
.tab.on{color:var(--pri);font-weight:700}
.tab.on .ic{filter:none;opacity:1}
/* cards & buttons */
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;background:var(--grad);box-shadow:0 6px 16px rgba(74,163,223,.3);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--pri);box-shadow:none;border:2px solid var(--pri)}
.btn.soft{background:var(--okbg);color:var(--ok);box-shadow:none}
.btn.gray{background:#e5e7eb;color:#4b5563;box-shadow:none}
.btn.sm{padding:10px;font-size:14px;border-radius:12px}
/* home */
.hero{background:var(--grad);border-radius:20px;color:#fff;padding:18px;position:relative;overflow:hidden;box-shadow:0 8px 20px rgba(74,163,223,.3)}
.hero .day{font-size:13px;opacity:.9}
.hero .big{font-size:38px;font-weight:800;margin:6px 0 2px}
.hero .streak{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;margin-top:8px}
.hero .ring-wrap{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(#fff var(--p,0%),rgba(255,255,255,.25) 0);display:flex;align-items:center;justify-content:center;flex:none;transition:--p .4s}
.ring .inner{width:74px;height:74px;border-radius:50%;background:rgba(74,163,223,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.ring .inner small{font-size:10px;font-weight:600;opacity:.8}
.chip{display:inline-block;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px;text-align:center}
.stat .n{font-size:18px;font-weight:800}
.stat .l{font-size:10px;color:var(--sub);margin-top:2px}
.section-title{font-size:15px;font-weight:800;margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between}
/* bars */
.bars{display:flex;align-items:flex-end;gap:6px;height:72px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar .b{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--grad);opacity:.85;min-height:2px}
.bar .b.zero{background:var(--line)}
.bar .l{font-size:9px;color:var(--sub)}
.bar .c{font-size:9px;font-weight:700;color:var(--sub)}
/* study card */
.study-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.study-progress{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:0 12px}
.study-progress i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .25s}
.wcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:26px 18px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;margin:6px 0 16px}
.wcard .emoji{font-size:34px;margin-bottom:8px}
.wcard .word{font-size:40px;font-weight:800;line-height:1.2;letter-spacing:.5px}
.wcard .speak{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:var(--okbg);color:var(--ok);border:none;border-radius:20px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer}
.wcard .zh{font-size:24px;font-weight:700;color:var(--text);margin-top:20px;animation:pop .25s}
.wcard .hint{position:absolute;bottom:12px;left:0;right:0;font-size:11px;color:var(--sub)}
.wcard .topic{position:absolute;top:14px;left:14px;font-size:11px;color:var(--sub);background:var(--bg);padding:4px 10px;border-radius:12px}
@keyframes pop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
.ans-row{display:flex;gap:12px}
.ans-row .btn{flex:1}
.btn.no{background:var(--bad);box-shadow:0 6px 16px rgba(255,59,48,.3)}
.btn.yes{background:var(--ok);box-shadow:0 6px 16px rgba(47,179,91,.3)}
/* summary */
.sum-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.sum-item:last-child{border-bottom:none}
.sum-item .v{font-weight:700;font-size:15px}
.sum-item .m{color:var(--sub);font-size:13px;margin-top:2px}
/* test */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;border:none;background:none;padding:10px 4px;border-radius:11px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 10px rgba(74,163,223,.3)}
.qword{font-size:34px;font-weight:800;text-align:center;margin:22px 0 6px}
.qsub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:15px;font-size:16px;font-weight:600;text-align:left;cursor:pointer;transition:all .12s;color:var(--text)}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.dim{opacity:.45}
.type-box{display:flex;gap:8px}
.type-box input{flex:1;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;background:var(--card);color:var(--text);outline:none}
.type-box input:focus{border-color:var(--pri)}
.type-box button{width:88px;border:none;border-radius:14px;background:var(--grad);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
/* lists */
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row .v{flex:1;font-size:16px;font-weight:700}
.row .m{font-size:13px;color:var(--sub)}
.row .emoji{font-size:22px}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.icon-btn.on{border-color:var(--gold)}
.search{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;background:var(--card);color:var(--text);outline:none;margin-bottom:10px}
.search:focus{border-color:var(--pri)}
.topic-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.topic-row .emoji{font-size:26px;width:36px;text-align:center}
.topic-row .nm{flex:1;font-size:15px;font-weight:700}
.topic-row .cnt{font-size:12px;color:var(--sub)}
/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line)}
.set-row .l{font-size:15px;font-weight:600}
.set-row .d{font-size:12px;color:var(--sub);margin-top:2px}
.toggle{width:52px;height:30px;border-radius:16px;background:var(--line);position:relative;border:none;cursor:pointer;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toggle.on{background:var(--ok)}
.toggle.on::after{left:25px}
.rate-seg{display:flex;gap:6px}
.rate-seg button{border:2px solid var(--line);background:none;color:var(--sub);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
.rate-seg button.on{border-color:var(--pri);color:var(--pri)}
/* modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s}
.mask.hide{display:none}
.dialog{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:400px;text-align:center;animation:pop .2s}
.dialog h3{font-size:17px;margin-bottom:8px}
.dialog p{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:18px}
.dialog .btn+.btn{margin-top:10px}
@keyframes fade{from{opacity:0}}
/* toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.85);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86%;text-align:center}
.toast.show{opacity:1}
.empty{padding:50px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
.empty .e{font-size:44px;display:block;margin-bottom:10px}
.foot-note{text-align:center;color:var(--sub);font-size:11px;margin-top:22px;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="topbar"></header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="mask hide" id="mask"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>

<script>
const WORDS_DATA = /*__DATA*/;

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
var $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const DAY = 86400000;
const keyOf = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayKey = () => keyOf(new Date());
const shortTopic = t => t.replace(/^[一二三四五六七八九十]+、/, '');
const emojiFor = t => { const i = TOPICS.indexOf(t); return ['🔢','🕐','👥','🍜','🚗','🛍️','🏨','💼','💰','🏥','⭐','💬'][i] || '📚'; };
const TOPICS = [...new Set(WORDS_DATA.map(w => w[0]))];

/* ============ 状态 ============ */
const KEY = 'vnvocab3000v1';
let S;
function defaults() { return { v: 1, learned: {}, fav: [], hidden: [], days: {}, set: { perDay: 10, rate: 1, auto: true, dark: false } }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) { if (!Array.isArray(s.hidden)) s.hidden = []; return s; } } catch (e) {}
  const s = defaults(); localStorage.setItem(KEY, JSON.stringify(s)); return s;
}
function save() { localStorage.setItem(KEY, JSON.stringify(S)); }
function normalize() {
  if (!Array.isArray(S.hidden)) S.hidden = [];
  if (![10, 20, 50, 100].includes(S.set.perDay)) S.set.perDay = S.set.perDay >= 200 ? 100 : 10;
}

/* ============ 隐藏词（自定义词库） ============ */
const HIDDEN_TIP = '已隐藏的单词不会出现在学习、测验、生词本和词表中，可在词表页底部「已隐藏」中恢复';
function isHidden(id) { return S.hidden.includes(WORDS_DATA[id][1]); }
function visCount() { return WORDS_DATA.length - S.hidden.length; }
function visIds() { const out = []; WORDS_DATA.forEach((w, i) => { if (!S.hidden.includes(w[1])) out.push(i); }); return out; }
function hideWordNow(id) {
  const v = WORDS_DATA[id][1];
  if (!S.hidden.includes(v)) S.hidden.push(v);
  S.fav = S.fav.filter(f => f !== id);
  save(); hideModal();
  if (TAB === 'words' && WORD_FILTER.active) renderWordList(); else switchTab(TAB);
  toast('已隐藏：' + v);
}
function hideWord(id) {
  const v = WORDS_DATA[id][1];
  confirmBox('隐藏单词', '“' + v + '”将不再背诵。' + HIDDEN_TIP + '。', '隐藏', function () { hideWordNow(id); });
}
function restoreWord(id) {
  const v = WORDS_DATA[id][1];
  S.hidden = S.hidden.filter(x => x !== v);
  save(); renderHidden(); toast('已恢复：' + v);
}
function renderHidden() {
  $('#topbar').innerHTML = '<div class="topbar-row"><button class="btn-back" onclick="renderWords()">‹</button><h1 style="font-size:17px">已隐藏词汇</h1></div>';
  const list = S.hidden.slice().reverse();
  $('#main').innerHTML =
    (list.length === 0 ? '<div class="empty"><span class="e">🙈</span>没有已隐藏的单词</div>' :
      list.map(v => {
        const i = WORDS_DATA.findIndex(w => w[1] === v);
        if (i < 0) return '';
        const w = WORDS_DATA[i];
        return '<div class="row" onclick="wordModal(' + i + ')">' +
          '<span class="emoji">' + emojiFor(w[0]) + '</span>' +
          '<div style="flex:1"><div class="v">' + esc(w[1]) + '</div><div class="m">' + esc(w[2]) + '</div></div>' +
          '<button class="icon-btn" onclick="event.stopPropagation();speak(\'' + esc(w[1]).replace(/'/g, "\\'") + '\')">🔊</button>' +
          '<button class="icon-btn on" onclick="event.stopPropagation();restoreWord(' + i + ')">↩︎</button>' +
        '</div>';
      }).join('')) +
    '<div class="foot-note">' + HIDDEN_TIP + '</div>';
}
S = load();
normalize(); save();
if (S.set.dark) document.body.classList.add('dark');

/* ============ 发音 ============ */
let VOICE = null;
let _ttsTipShown = false;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => v.lang && v.lang.toLowerCase().startsWith('vi')) || VOICE; } catch (e) {} }
try { speechSynthesis.onvoiceschanged = pickVoice; pickVoice(); } catch (e) {}
function viVoiceAvailable() {
  try {
    const vs = speechSynthesis.getVoices();
    if (!vs || !vs.length) return true;
    return vs.some(v => v.lang && v.lang.toLowerCase().startsWith('vi'));
  } catch (e) { return true; }
}
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('当前设备不支持语音'); return; }
  if (!_ttsTipShown && !viVoiceAvailable()) {
    _ttsTipShown = true;
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent || '');
    guideBox('未检测到越南语语音',
      '当前设备可能未安装越南语语音包，发音会无声或不准。<br>请按以下步骤下载：<br><br>' +
      (ios
        ? '① 打开「设置」→「辅助功能」<br>② 「朗读内容」→「声音」<br>③ 下载「越南语（Tiếng Việt）」语音'
        : '① 打开「设置」→「系统」<br>② 「语言与输入法」→「文字转语音」（TTS）<br>③ 下载越南语语音数据') +
      '<br><br>下载完成后返回本页，点「🔊」即可发音。');
  }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN'; if (VOICE) u.voice = VOICE; u.rate = S.set.rate;
    speechSynthesis.speak(u);
  } catch (e) { toast('语音播放失败'); }
}
function guideBox(title, html) {
  const m = $('#mask'); const d = $('#dialog');
  d.innerHTML = '<h3>' + esc(title) + '</h3>' +
    '<div style="text-align:left;font-size:14px;line-height:1.8;color:var(--text);margin:6px 0 16px">' + html + '</div>' +
    '<button class="btn sm" onclick="hideModal()">我知道了</button>';
  m.classList.remove('hide');
}

/* ============ 打卡 / 进度 ============ */
function markPractice(newWord) {
  const k = todayKey();
  if (!S.days[k]) S.days[k] = { n: 0, r: 0 };
  S.days[k].n += newWord ? 1 : 0;
  S.days[k].r += newWord ? 0 : 1;
  save();
}
function streak() {
  let c = 0; const d = new Date();
  if (!S.days[todayKey()]) d.setDate(d.getDate() - 1);
  while (S.days[keyOf(d)]) { c++; d.setDate(d.getDate() - 1); }
  return c;
}
function learnedCount() { return Object.keys(S.learned).filter(id => !isHidden(+id)).length; }
function masterCount() { return Object.keys(S.learned).filter(id => !isHidden(+id) && S.learned[id].b >= 5).length; }
function dueReviewIds() {
  const now = Date.now();
  const ids = Object.keys(S.learned).map(Number).filter(id => S.learned[id].due <= now && !isHidden(id));
  const groups = {};
  ids.forEach(id => {
    const L = S.learned[id];
    const w = (L.w || 0) * 2 + (5 - Math.min(L.b || 0, 5));
    (groups[w] = groups[w] || []).push(id);
  });
  const out = [];
  Object.keys(groups).map(Number).sort((a, b) => b - a)
    .forEach(w => { shuffle(groups[w]); out.push(...groups[w]); });
  return out;
}
function interval(b) { return [0, DAY, 2 * DAY, 4 * DAY, 7 * DAY, 15 * DAY][Math.min(b, 5)]; }
function updateSRS(id, know) {
  if (!S.learned[id]) S.learned[id] = { b: 0, due: 0, r: 0, w: 0 };
  const L = S.learned[id];
  if (know) { L.b = Math.min(L.b + 1, 6); L.due = Date.now() + interval(L.b); }
  else { L.b = Math.max(L.b - 1, 0); L.due = Date.now() + 4 * 3600 * 1000; }
  L.r++; if (!know) L.w++;
  save();
}
function newWordIds(limit) {
  const pool = [];
  WORDS_DATA.forEach((w, i) => { if (!S.learned[i] && !S.hidden.includes(w[1])) pool.push(i); });
  shuffle(pool);
  return pool.slice(0, limit);
}
function dailyQueue() {
  const review = dueReviewIds().slice(0, 100);
  const fresh = newWordIds(S.set.perDay);
  return { ids: [...review, ...fresh], freshSet: new Set(fresh) };
}
function isNewToday(id) { return Sess && Sess.freshSet && Sess.freshSet.has(id); }

/* ============ UI 基础 ============ */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');

}

function weekBars() {
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  let html = ''; let mx = 1;
  const arr = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = keyOf(d); const c = S.days[k] ? S.days[k].n + S.days[k].r : 0; arr.push([k, c, d.getDay()]); if (c > mx) mx = c; }
  arr.forEach(a => {
    const h = Math.max(4, Math.round(a[1] / mx * 52));
    html += '<div class="bar"><div class="c">' + (a[1] || '') + '</div><div class="b' + (a[1] ? '' : ' zero') + '" style="height:' + h + 'px"></div><div class="l">' + (a[0] === todayKey() ? '今' : days[a[2]]) + '</div></div>';
  });
  return html;
}

function answer(know) {

function pickMode(b) { $$('#segMode button').forEach(x => x.classList.remove('on')); b.classList.add('on'); TEST.mode = b.dataset.m; }
function pickScope(b) { $$('#segScope button').forEach(x => x.classList.remove('on')); b.classList.add('on'); TEST.scope = b.dataset.s; }
function pickCount(b) { $$('#segCount button').forEach(x => x.classList.remove('on')); b.classList.add('on'); TEST.count = +b.dataset.c; }
function buildTest() {
  let pool;
  if (TEST.scope === 'fav') pool = S.fav.filter(id => !isHidden(id));
  else if (TEST.scope === 'all') pool = visIds();
  else pool = Object.keys(S.learned).map(Number).filter(id => !isHidden(id));
  if (pool.length === 0) { toast('该范围还没有词'); return; }
  shuffle(pool);
  pool = pool.slice(0, TEST.count);
  TEST.qs = pool.map(id => ({ id, dists: distractors(id, 3) }));
  TEST.i = 0; TEST.right = 0; TEST.wrong = [];
  renderTestQ();
}
function distractors(id, n) {
  const w = WORDS_DATA[id];
  const used = new Set([w[2]]);
  const pool = [];
  WORDS_DATA.forEach((x, i) => { if (i !== id && x[2] !== w[2] && !S.hidden.includes(x[1])) pool.push(i); });
  shuffle(pool);
  const out = [];
  for (const i of pool) { if (out.length >= n) break; if (WORDS_DATA[i][0] === w[0] && !used.has(WORDS_DATA[i][2])) { out.push(i); used.add(WORDS_DATA[i][2]); } }
  for (const i of pool) { if (out.length >= n) break; if (!used.has(WORDS_DATA[i][2])) { out.push(i); used.add(WORDS_DATA[i][2]); } }
  return out;
}
function renderTestQ() {
  $('#topbar').innerHTML = '<div class="topbar-row"><button class="btn-back" onclick="renderTestConfig()">✕</button><h1 style="font-size:17px">' + modeName(TEST.mode) + '</h1></div>';
  const q = TEST.qs[TEST.i]; const w = WORDS_DATA[q.id];
  const pct = TEST.i / TEST.qs.length * 100;
  let body;
  if (TEST.mode === 'zh') {
    const opts = shuffle([...q.dists.map(d => WORDS_DATA[d][2]), w[2]].map((z, idx) => ({ z, idx })));
    body = '<div class="qword">' + esc(w[1]) + '</div>' +
      '<div class="qsub">选择正确的中文意思</div>' +
      '<button class="icon-btn" style="margin:0 auto 10px;display:flex" onclick="speak(\'' + esc(w[1]).replace(/'/g, "\\'") + '\')">🔊</button>' +
      '<div class="opts">' + opts.map(o => '<button class="opt" data-z="' + esc(o.z) + '" onclick="checkOpt(this, \'' + esc(o.z).replace(/'/g, "\\'") + '\')">' + esc(o.z) + '</button>').join('') + '</div>';
  } else if (TEST.mode === 'listen') {
    const opts = shuffle([...q.dists.map(d => WORDS_DATA[d][2]), w[2]].map((z, idx) => ({ z, idx })));
    body = '<div style="text-align:center;margin:20px 0 6px"><button class="speak" style="font-size:34px;width:80px;height:80px;border-radius:50%;background:var(--grad);color:#fff;border:none;cursor:pointer" onclick="speak(\'' + esc(w[1]).replace(/'/g, "\\'") + '\')">🔊</button></div>' +
      '<div class="qsub">听发音，选择正确意思</div>' +
      '<div class="opts">' + opts.map(o => '<button class="opt" onclick="checkOpt(this, \'' + esc(o.z).replace(/'/g, "\\'") + '\')">' + esc(o.z) + '</button>').join('') + '</div>';
  } else {
    body = '<div class="qword" style="font-size:22px">' + esc(w[2]) + '</div>' +
      '<div class="qsub">输入对应的越南语单词</div>' +
      '<div class="type-box"><input id="tinput" placeholder="输入越南语…" autocomplete="off" autocapitalize="off"><button onclick="checkType()">确定</button></div>' +
      '<div style="text-align:center;margin-top:12px"><button class="btn gray sm" style="display:inline-block;width:auto;padding:8px 18px" onclick="hintType()">💡 提示</button></div>';
  }
  $('#main').innerHTML =
    '<div class="study-top"><span style="font-size:13px;font-weight:700">' + (TEST.i + 1) + ' / ' + TEST.qs.length + '</span>' +
    '<div class="study-progress"><i style="width:' + pct + '%"></i></div>' +
    '<span class="chip">' + (S.learned[TEST.qs[TEST.i].id] ? '复习' : '新') + '</span></div>' +
    '<div class="card" style="min-height:320px">' + body + '</div>';
  if (TEST.mode === 'type') setTimeout(() => { const el = $('#tinput'); if (el) el.focus(); }, 60);
  if (TEST.mode === 'listen' && S.set.auto) setTimeout(() => speak(w[1]), 400);
}
function modeName(m) { return { zh: '四选一', listen: '听音选义', type: '拼写' }[m]; }
function checkOpt(btn, z) {
  if (TEST._locked) return; TEST._locked = true;
  const w = WORDS_DATA[TEST.qs[TEST.i].id];
  const ok = z === w[2];
  $$('#main .opt').forEach(o => o.classList.add('dim'));
  btn.classList.add(ok ? 'right' : 'wrong');
  const ansBtn = $$('#main .opt').find(o => o.dataset.z === w[2]);
  if (ansBtn) ansBtn.classList.add('right');
  if (!ok) TEST.wrong.push(TEST.qs[TEST.i].id);
  else TEST.right++;
  applyTestSRS(TEST.qs[TEST.i].id, ok);
  setTimeout(() => { TEST._locked = false; TEST.i++; if (TEST.i >= TEST.qs.length) renderTestResult(); else renderTestQ(); }, 650);
}
function hintType() {
  const w = WORDS_DATA[TEST.qs[TEST.i].id];
  toast('答案：' + w[1]);
  const el = $('#tinput'); if (el) el.value = '';
}
function checkType() {
  const el = $('#tinput'); const val = (el.value || '').trim();
  if (!val) return;
  const w = WORDS_DATA[TEST.qs[TEST.i].id];
  const ok = val === w[1];
  el.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)';
  if (!ok) { toast('正确：' + w[1]); TEST.wrong.push(TEST.qs[TEST.i].id); }
  else TEST.right++;
  applyTestSRS(TEST.qs[TEST.i].id, ok);
  setTimeout(() => { el.style.borderColor = ''; TEST.i++; if (TEST.i >= TEST.qs.length) renderTestResult(); else renderTestQ(); }, 900);
}
function applyTestSRS(id, ok) { if (S.learned[id]) { updateSRS(id, ok); markPractice(false); } }
function renderTestResult() {
  const wr = TEST.wrong;
  $('#topbar').innerHTML = '<div class="topbar-row"><button class="btn-back" onclick="renderTestConfig()">✕</button><h1 style="font-size:17px">测验结果</h1></div>';
  const score = Math.round(TEST.right / TEST.qs.length * 100);
  const em = score === 100 ? '🏆' : score >= 80 ? '🎉' : score >= 60 ? '💪' : '📖';
  $('#main').innerHTML =
    '<div class="card" style="text-align:center;padding:26px">' +
      '<div style="font-size:46px">' + em + '</div>' +
      '<div style="font-size:40px;font-weight:800;margin:6px 0">' + score + '<span style="font-size:18px">分</span></div>' +
      '<p style="color:var(--sub)">答对 ' + TEST.right + ' / ' + TEST.qs.length + ' · 错 ' + wr.length + ' 题</p>' +
    '</div>' +
    (wr.length ? '<div class="section-title">错题（' + wr.length + '）</div><div class="card">' +
      wr.map(id => { const w = WORDS_DATA[id]; return '<div class="sum-item" onclick="wordModal(' + id + ')"><div><div class="v">' + esc(w[1]) + '</div><div class="m">' + esc(w[2]) + '</div></div><button class="icon-btn" onclick="event.stopPropagation();speak(\'' + esc(w[1]).replace(/'/g, "\\'") + '\')">🔊</button></div>'; }).join('') +
    '</div><div style="margin-top:14px;display:flex;gap:10px">' +
      '<button class="btn ghost" onclick="renderTestConfig()">返回</button>' +
      '<button class="btn" onclick="retryWrong()">重练错题</button>' +
    '</div>' : '<div style="margin-top:14px"><button class="btn" onclick="renderTestConfig()">继续测验</button></div>');
}
function retryWrong() {
  const ids = TEST.wrong.slice();
  TEST.qs = ids.map(id => ({ id, dists: distractors(id, 3) }));
  TEST.i = 0; TEST.right = 0; TEST.wrong = [];
  renderTestQ();
}

function exportFav() {
  const ids = S.fav.filter(id => !isHidden(id));
  if (!ids.length) { toast('生词本是空的'); return; }
  const groups = TOPICS.map(t => ({ t, ids: ids.filter(id => WORDS_DATA[id][0] === t) })).filter(g => g.ids.length);
  const now = new Date();
  const dateStr = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日';
  let rows = ''; let n = 0;
  groups.forEach(g => {
    rows += '<tr class="g"><td colspan="4">' + esc(g.t) + '</td></tr>';
    g.ids.forEach(id => {
      n++; const w = WORDS_DATA[id];
      rows += '<tr><td>' + n + '</td><td class="v">' + esc(w[1]) + '</td><td>' + esc(w[2]) + '</td><td>' + esc(shortTopic(w[0])) + '</td></tr>';
    });
  });
  const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>越南语生词本 · 打印清单</title><style>' +
    'body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:24px;color:#222}' +
    'h1{font-size:22px;margin:0 0 4px}.meta{font-size:13px;color:#666;margin:0}' +
    '.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}' +
    '.btn{background:#4aa3df;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer}' +
    'table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #ccc;padding:7px 10px;text-align:left}' +
    'th{background:#f2f7fc}.g td{background:#eef3f8;font-weight:700;font-size:13px}.v{font-weight:700}' +
    '@media print{.btn{display:none}body{margin:8px}}' +
    '</style></head><body>' +
    '<div class="bar"><div><h1>越南语生词本 · 打印清单</h1><p class="meta">' + dateStr + ' · 共 ' + ids.length + ' 词 · 东兴还珠越南语培训中心</p></div>' +
    '<button class="btn" onclick="window.print()">🖨️ 打印 / 保存 PDF</button></div>' +
    '<table><thead><tr><th style="width:48px">#</th><th>越南语</th><th>中文</th><th style="width:110px">分类</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '</body></html>';
  const w = window.open('', '_blank');
  if (!w) { toast('浏览器拦截了弹窗，请允许弹窗后重试'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}
function favRow(id) {
  const w = WORDS_DATA[id];
  return '<div class="row" onclick="wordModal(' + id + ')">' +
    '<span class="emoji">' + emojiFor(w[0]) + '</span>' +
    '<div style="flex:1"><div class="v">' + esc(w[1]) + '</div><div class="m">' + esc(w[2]) + '</div></div>' +
    '<button class="icon-btn" onclick="event.stopPropagation();speak(\'' + esc(w[1]).replace(/'/g, "\\'") + '\')">🔊</button>' +
    '<button class="icon-btn' + (S.learned[id] && S.learned[id].b >= 5 ? ' on' : '') + '" onclick="event.stopPropagation();masterWord(' + id + ')">✓</button>' +
    '<button class="icon-btn" onclick="event.stopPropagation();toggleFav(' + id + ');renderFav()">✕</button>' +
  '</div>';
}
function masterWord(id) { if (!S.learned[id]) S.learned[id] = { b: 0, due: 0, r: 0, w: 0 }; S.learned[id].b = 6; S.learned[id].due = Date.now() + interval(6); save(); toast('标记为已掌握'); renderFav(); }
function flashFav() {
  const ids = shuffle(S.fav.filter(id => !isHidden(id)));
  if (!ids.length) { toast('生词本是空的'); return; }
  Sess = { ids, freshSet: new Set(), i: 0, right: 0, wrong: [], newList: [], startNew: learnedCount() };
  renderStudy();
}

/* ============ 词表 ============ */
let WORD_FILTER = { topic: null, q: '' };
function renderWords() {
  WORD_FILTER.active = false;
  $('#topbar').innerHTML = '<h1>📚 全部词表</h1><div class="sub">' + visCount() + ' 词 · ' + TOPICS.length + ' 类</div>';
  let html = TOPICS.map((t, i) => {
    const n = WORDS_DATA.filter(w => w[0] === t && !S.hidden.includes(w[1])).length;
    const l = WORDS_DATA.reduce((c, w, idx) => c + (w[0] === t && !S.hidden.includes(w[1]) && S.learned[idx] ? 1 : 0), 0);
    return '<div class="topic-row" onclick="openTopic(' + i + ')"><span class="emoji">' + emojiFor(t) + '</span>' +
      '<div class="nm">' + esc(shortTopic(t)) + '</div>' +
      '<div class="cnt">' + l + ' / ' + n + '</div>' +
      '<span style="color:var(--sub)">›</span></div>';
  }).join('');
  html += '<div class="topic-row" onclick="openTopic(-1)" style="background:var(--grad);color:#fff;border-radius:14px;padding:14px;margin-top:10px;box-shadow:0 6px 14px rgba(74,163,223,.25)">' +
    '<span class="emoji">🗂️</span><div class="nm">全部词汇（含搜索）</div><div class="cnt" style="color:rgba(255,255,255,.8)">' + visCount() + '</div><span>›</span></div>';
  html += '<div class="topic-row" onclick="renderHidden()"><span class="emoji">🙈</span><div class="nm">已隐藏词汇（自定义词库）</div><div class="cnt">' + S.hidden.length + '</div><span>›</span></div>';
  $('#main').innerHTML = html + '<div class="foot-note">点击分类进入单词列表 · 星标加入生词本 · 隐藏单词可自定义词库</div>';
}
function openTopic(i) {
  WORD_FILTER = { topic: i, q: '' };
  renderWordList();
}
function renderWordList() {
  WORD_FILTER.active = true;
  $('#topbar').innerHTML = '<div class="topbar-row"><button class="btn-back" onclick="renderWords()">‹</button><h1 style="font-size:17px">' + (WORD_FILTER.topic < 0 ? '全部词汇' : esc(shortTopic(TOPICS[WORD_FILTER.topic]))) + '</h1></div>';
  const q = (WORD_FILTER.q || '').toLowerCase();
  let ids = [];
  WORDS_DATA.forEach((w, i) => {
    if (S.hidden.includes(w[1])) return;
    if (WORD_FILTER.topic >= 0 && w[0] !== TOPICS[WORD_FILTER.topic]) return;
    if (q && !w[1].toLowerCase().includes(q) && !w[2].toLowerCase().includes(q)) return;
    ids.push(i);
  });
  ids.sort((a, b) => { const ta = TOPICS.indexOf(WORDS_DATA[a][0]), tb = TOPICS.indexOf(WORDS_DATA[b][0]); return ta !== tb ? ta - tb : a - b; });
  const total = ids.length;
  const shown = ids.slice(0, WORD_FILTER._n || 400);
  $('#main').innerHTML =
    '<input class="search" placeholder="🔍 搜索越南语或中文…" value="' + esc(WORD_FILTER.q) + '" oninput="WORD_FILTER.q=this.value;WORD_FILTER._n=400;renderWordList()">' +
    '<p style="font-size:12px;color:var(--sub);margin-bottom:6px">共 ' + total + ' 词 · 已显示 ' + shown.length + '</p>' +
    shown.map(id => {
      const w = WORDS_DATA[id];
      const fav = S.fav.includes(id);
      return '<div class="row" onclick="wordModal(' + id + ')">' +
        '<span class="emoji">' + emojiFor(w[0]) + '</span>' +
        '<div style="flex:1"><div class="v">' + esc(w[1]) + '</div><div class="m">' + esc(w[2]) + '</div></div>' +
        '<button class="icon-btn" onclick="event.stopPropagation();speak(\'' + esc(w[1]).replace(/'/g, "\\'") + '\')">🔊</button>' +
        '<button class="icon-btn' + (fav ? ' on' : '') + '" onclick="event.stopPropagation();toggleFav(' + id + ');renderWordList()">' + (fav ? '⭐' : '☆') + '</button>' +
        '<button class="icon-btn" onclick="event.stopPropagation();hideWord(' + id + ')">🙈</button>' +
      '</div>';
    }).join('') +
    (shown.length < total ? '<div style="margin-top:14px"><button class="btn gray sm" onclick="WORD_FILTER._n=(WORD_FILTER._n||400)+400;renderWordList()">加载更多（' + (total - shown.length) + '）</button></div>' : '');
}

/* ============ 我的 ============ */
function renderMe() {
  $('#topbar').innerHTML = '<h1>👤 我的</h1><div class="sub">统计 · 设置 · 数据</div>';
  const total = visCount();
  const lc = learnedCount();
  const mc = masterCount();
  const days30 = heatmap();
  const rs = reviewStats();
  $('#main').innerHTML =
    '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">' +
      '<div class="stat"><div class="n">' + lc + '</div><div class="l">已学 / ' + total + '</div></div>' +
      '<div class="stat"><div class="n">' + mc + '</div><div class="l">已掌握</div></div>' +
      '<div class="stat"><div class="n">' + streak() + '</div><div class="l">连续打卡</div></div>' +
    '</div>' +
    '<div class="section-title">近 30 天学习</div>' +
    '<div class="card" style="display:flex;flex-wrap:wrap;gap:4px">' + days30 + '</div>' +
    '<div class="section-title">学习报告</div>' +
    '<div class="card" style="padding:14px">' +
      '<div class="stat-grid" style="grid-template-columns:repeat(2,1fr);margin-bottom:10px">' +
        '<div class="stat"><div class="n">' + weekSum() + '</div><div class="l">本周学习（词）</div></div>' +
        '<div class="stat"><div class="n">' + rs.r + '</div><div class="l">累计复习（次）</div></div>' +
        '<div class="stat"><div class="n">' + (rs.r > 0 ? Math.round((rs.r - rs.w) / rs.r * 100) + '%' : '—') + '</div><div class="l">整体正确率</div></div>' +
        '<div class="stat"><div class="n">' + Object.keys(S.days).length + '</div><div class="l">累计学习（天）</div></div>' +
      '</div>' +
      '<div class="foot-note" style="margin:0">正确率按「认识次数 ÷ 复习总数」估算，复习越多越接近真实水平。</div>' +
    '</div>' +
    '<div class="section-title">设置</div>' +
    '<div class="card" style="padding:6px 14px">' +
      '<div class="set-row"><div><div class="l">每日新词数</div><div class="d">当前 ' + S.set.perDay + ' 个</div></div>' +
      '<div class="rate-seg">' + [10, 20, 50, 100].map(n => '<button class="' + (S.set.perDay === n ? 'on' : '') + '" onclick="setPerDay(' + n + ')">' + n + '</button>').join('') + '</div></div>' +
      '<div class="set-row"><div><div class="l">发音语速</div><div class="d">' + ['慢', '正常', '快'][Math.round(S.set.rate * 2) - 1] + '</div></div>' +
      '<div class="rate-seg">' + [['慢', 0.8], ['正常', 1], ['快', 1.2]].map(r => '<button class="' + (S.set.rate === r[1] ? 'on' : '') + '" onclick="setRate(' + r[1] + ')">' + r[0] + '</button>').join('') + '</div></div>' +
      '<div class="set-row"><div><div class="l">自动发音</div><div class="d">展示单词时自动朗读</div></div>' +
      '<button class="toggle' + (S.set.auto ? ' on' : '') + '" onclick="S.set.auto=!S.set.auto;save();renderMe()"></button></div>' +
      '<div class="set-row"><div><div class="l">深色模式</div><div class="d">夜间背词护眼</div></div>' +
      '<button class="toggle' + (S.set.dark ? ' on' : '') + '" onclick="toggleDark()"></button></div>' +
    '</div>' +
    '<div class="section-title">数据</div>' +
    '<div class="card" style="padding:6px 14px">' +
      '<div class="set-row"><div><div class="l">导出进度</div><div class="d">备份学习记录</div></div>' +
      '<button class="btn gray sm" style="width:auto;padding:8px 16px" onclick="exportData()">导出</button></div>' +
      '<div class="set-row"><div><div class="l">导入进度</div><div class="d">恢复备份文件</div></div>' +
      '<button class="btn gray sm" style="width:auto;padding:8px 16px" onclick="document.getElementById(\'imp\').click()">导入</button></div>' +
      '<div class="set-row" style="border-bottom:none"><div><div class="l" style="color:var(--bad)">清空数据</div><div class="d">删除全部学习记录</div></div>' +
      '<button class="btn sm" style="width:auto;padding:8px 16px;background:var(--bad)" onclick="resetData()">清空</button></div>' +
    '</div>' +
    '<input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)">' +
    '<div class="foot-note">数据版本 2026-08-15d<br>' + total + ' 词 · ' + TOPICS.length + ' 类 · PWA 离线 App</div>';
}
function heatmap() {
  let html = '';
  const now = new Date();
  for (let i = 29; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const c = S.days[keyOf(d)] ? S.days[keyOf(d)].n + S.days[keyOf(d)].r : 0;
    const lv = c === 0 ? '#eee' : c < 10 ? '#d9ebfa' : c < 30 ? '#8fc2e9' : '#4aa3df';
    html += '<div style="width:18px;height:18px;border-radius:5px;background:' + lv + '" title="' + keyOf(d) + ' ' + c + '词"></div>';
  }
  return html;
}
function weekSum() {
  let s = 0; const now = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    const k = keyOf(d);
    if (S.days[k]) s += S.days[k].n + S.days[k].r;
  }
  return s;
}
function reviewStats() {
  let r = 0, w = 0;
  Object.values(S.learned).forEach(L => { r += L.r || 0; w += L.w || 0; });
  return { r, w };
}
function setPerDay(n) { S.set.perDay = n; save(); renderMe(); toast('每日新词改为 ' + n); }
function setRate(r) { S.set.rate = r; save(); renderMe(); }
function toggleDark() { S.set.dark = !S.set.dark; save(); document.body.classList.toggle('dark', S.set.dark); renderMe(); }
function exportData() {
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '越南语背单词-进度备份-' + todayKey() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出备份');
}
function importData(input) {
  const f = input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const s = JSON.parse(rd.result);
      if (!s || s.v !== 1) throw new Error('bad');
      S = s; normalize(); if (S.set.dark) document.body.classList.add('dark'); save(); renderMe();
      toast('导入成功');
    } catch (e) { toast('文件格式不对'); }
  };
  rd.readAsText(f);
  input.value = '';
}
function resetData() {
  confirmBox('清空数据', '将删除全部学习进度、生词本和打卡记录，且无法恢复。确定继续吗？', '确定清空', function () { localStorage.removeItem(KEY); location.reload(); });
}

/* ============ 启动 ============ */
function isWeChatIOS() {
  const ua = navigator.userAgent || '';
  return /MicroMessenger/i.test(ua) && /iP(hone|ad|od)/i.test(ua);
}
function maybeWxGuide() {
  if (!isWeChatIOS()) return;
  guideBox('建议在 Safari 中打开',
    '微信内置浏览器对「添加到主屏幕 / 离线使用」支持不完整，可能无法正常显示。<br><br>' +
    '① 点右上角「···」<br>② 选择「在 Safari 中打开」<br>③ 点底部「分享」→「添加到主屏幕」<br><br>' +
    '之后从主屏幕图标进入，全屏且断网也能用。');
}
switchTab('home');
maybeWxGuide();
window.addEventListener('keydown', e => { if (e.key === 'Enter' && TEST && TEST.mode === 'type') { e.preventDefault(); checkType(); } });
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
